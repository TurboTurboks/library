<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

    <title>LIbrary for Books</title>
</head>

<body>
    <header>
        <h1>Book Library</h1>

        <button id="add-book-btn">Add book</button>

        <dialog id="book-dialog">
            <form id="book-form">
                <label for="title">Title:</label>
                <input data-title="title" type="text" id="title" name="title" required>

                <label for="author">Author:</label>
                <input type="text" id="author" name="author" required>

                <label for="pages">Pages:</label>
                <input type="number" id="pages" name="pages" min="1" required>

                <label for="read">Have you read it?</label>
                <input type="checkbox" id="read" name="read">

                <button type="submit">Add book</button>
                <button type="button" id="close-dialog">Cancel</button>
            </form>
        </dialog>

    </header>
    <main>

    </main>
</body>

</html>
